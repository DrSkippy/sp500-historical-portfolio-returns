[project]
name = "sp500-historical-portfolio-returns"
version = "0.1.0"
description = "Backtests Buy&Hold, Kelly and Insurance portfolio strategies over S&P 500 history"
authors = [{name = "Scott Hendrickson", email = "scott@drskippy.net"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)",
    "types-requests (>=2.33.0.20260906,<3.0.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
]
notebook = [
    "notebook (>=7.6.3,<8.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["returns", "bin", "tests", "notebooks/insurance_scan/sweep.py", "notebooks/insurance_scan/fair_premium.py"]

[tool.black]
target-version = ["py312"]
